x-runtime-logging: &runtime-logging
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

services:
  session-agent-postgres:
    <<: *runtime-logging
    image: postgres:17
    environment:
      POSTGRES_DB: session_agent
      POSTGRES_USER: session_agent
      POSTGRES_PASSWORD: ${SESSION_AGENT_POSTGRES_PASSWORD:?required}
    volumes: [session-agent-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session_agent -d session_agent"]
    networks: [session-agent-network]

  semantic-mongodb:
    <<: *runtime-logging
    image: mongo:8.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SEMANTIC_MONGO_ROOT_USERNAME:-semantic_root}
      MONGO_INITDB_ROOT_PASSWORD: ${SEMANTIC_MONGO_ROOT_PASSWORD:?required}
      MONGO_INITDB_DATABASE: semantic_uat
      SEMANTIC_MONGO_BOOTSTRAP_PASSWORD: ${SEMANTIC_MONGO_BOOTSTRAP_PASSWORD:?required}
      SEMANTIC_MONGO_INDEXER_PASSWORD: ${SEMANTIC_MONGO_INDEXER_PASSWORD:?required}
      SEMANTIC_MONGO_QUERY_PASSWORD: ${SEMANTIC_MONGO_QUERY_PASSWORD:?required}
    command: ["mongod", "--auth", "--bind_ip_all"]
    volumes:
      - semantic-mongodb-data:/data/db
      - ${STARTER_ROOT}/config/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
    networks: [semantic-read, semantic-admin]

  semantic-mongo-init:
    <<: *runtime-logging
    image: java-agent-semantic-indexer
    build:
      context: ${STARTER_ROOT}/.runtime/sources/java-code-intelligence
      dockerfile: Dockerfile.indexer
    profiles: [setup, schema-maintenance]
    depends_on:
      semantic-mongodb:
        condition: service_healthy
    environment:
      SEMANTIC_MONGODB_URI: mongodb://semantic_bootstrap:${SEMANTIC_MONGO_BOOTSTRAP_PASSWORD:?required}@semantic-mongodb:27017/semantic_uat?authSource=semantic_uat
    command: ["--spring.main.web-application-type=none", "--semantic.schema-bootstrap=true"]
    restart: "no"
    networks: [semantic-admin]

  semantic-mongo-users:
    <<: *runtime-logging
    image: mongo:8.0.4
    profiles: [schema-maintenance]
    depends_on:
      semantic-mongodb:
        condition: service_healthy
    environment:
      SEMANTIC_MONGO_ROOT_USERNAME: ${SEMANTIC_MONGO_ROOT_USERNAME:-semantic_root}
      SEMANTIC_MONGO_ROOT_PASSWORD: ${SEMANTIC_MONGO_ROOT_PASSWORD:?required}
      SEMANTIC_MONGO_BOOTSTRAP_PASSWORD: ${SEMANTIC_MONGO_BOOTSTRAP_PASSWORD:?required}
      SEMANTIC_MONGO_INDEXER_PASSWORD: ${SEMANTIC_MONGO_INDEXER_PASSWORD:?required}
      SEMANTIC_MONGO_QUERY_PASSWORD: ${SEMANTIC_MONGO_QUERY_PASSWORD:?required}
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      exec mongosh --quiet --host semantic-mongodb
      --username "$$SEMANTIC_MONGO_ROOT_USERNAME"
      --password "$$SEMANTIC_MONGO_ROOT_PASSWORD"
      --authenticationDatabase admin --file /config/mongo-init.js
    volumes:
      - ${STARTER_ROOT}/config/mongo-init.js:/config/mongo-init.js:ro
    restart: "no"
    networks: [semantic-admin]

  semantic-indexer:
    <<: *runtime-logging
    image: java-agent-semantic-indexer
    build:
      context: ${STARTER_ROOT}/.runtime/sources/java-code-intelligence
      dockerfile: Dockerfile.indexer
    depends_on:
      semantic-mongodb:
        condition: service_healthy
    environment:
      SEMANTIC_MONGODB_URI: mongodb://semantic_indexer:${SEMANTIC_MONGO_INDEXER_PASSWORD:?required}@semantic-mongodb:27017/semantic_uat?authSource=semantic_uat
      SEMANTIC_INDEXER_ADMIN_TOKEN: ${SEMANTIC_INDEXER_ADMIN_TOKEN:?required}
      SPRING_PROFILES_ACTIVE: ${SEMANTIC_UAT_PROFILE:-}
      GIT_USERNAME: ${GIT_USERNAME:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      JDTLS_MAX_ACTIVE_WORKSPACES: ${JDTLS_MAX_ACTIVE_WORKSPACES:-2}
      REPOSITORY_SYNTAX_CACHE_MAXIMUM_WEIGHT: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_WEIGHT:-120000}
      REPOSITORY_SYNTAX_CACHE_MAXIMUM_ENTRY_WEIGHT: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_ENTRY_WEIGHT:-60000}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/semantic-repositories.yml
    ports: ["127.0.0.1:${SEMANTIC_INDEXER_HOST_PORT:-8081}:8080"]
    volumes:
      - ${STARTER_ROOT}/config/semantic-repositories.yml:/config/semantic-repositories.yml:ro
      - ${STARTER_ROOT}/.runtime/uat-git:/uat-git:ro
      - semantic-indexer-repository-data:/data/repos
      - semantic-indexer-jdt-data:/data/jdtls
    networks: [semantic-admin]

  semantic-query:
    <<: *runtime-logging
    image: java-agent-semantic-query
    build:
      context: ${STARTER_ROOT}/.runtime/sources/java-code-intelligence
      dockerfile: Dockerfile.query
    depends_on:
      semantic-mongodb:
        condition: service_healthy
    environment:
      SEMANTIC_MONGODB_URI: mongodb://semantic_query:${SEMANTIC_MONGO_QUERY_PASSWORD:?required}@semantic-mongodb:27017/semantic_uat?authSource=semantic_uat
      SEMANTIC_QUERY_API_TOKEN: ${SEMANTIC_QUERY_API_TOKEN:?required}
    networks: [semantic-read]

  semantic-query-gateway:
    <<: *runtime-logging
    image: alpine:3.21
    depends_on:
      semantic-query:
        condition: service_started
    command: ["sh", "-ec", "exec nc -lk -p 8080 -e nc semantic-query 8080"]
    ports: ["127.0.0.1:${SEMANTIC_HOST_PORT:-8080}:8080"]
    restart: unless-stopped
    networks: [semantic-read, semantic-query-ingress]

  session-agent-runtime:
    <<: *runtime-logging
    build:
      context: ${STARTER_ROOT}/.runtime/sources/session-agent-runtime
    depends_on:
      session-agent-postgres:
        condition: service_healthy
    environment:
      SESSION_AGENT_DATASOURCE_URL: jdbc:postgresql://session-agent-postgres:5432/session_agent
      SESSION_AGENT_DATASOURCE_USERNAME: session_agent
      SESSION_AGENT_DATASOURCE_PASSWORD: ${SESSION_AGENT_POSTGRES_PASSWORD:?required}
      SPRING_APPLICATION_JSON: >-
        {"session-agent":{"mcp":{"connections":{"semantic":{"enabled":true,"url":"http://semantic-query:8080/mcp","headers":{"X-Api-Token":"${SEMANTIC_QUERY_API_TOKEN:?required}"}}}}}}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?required}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GOOGLE_API_KEY:?required}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-3.1-flash-lite}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      SERVER_ADDRESS: 0.0.0.0
    ports: ["127.0.0.1:${SESSION_AGENT_HOST_PORT:-8090}:8080"]
    networks: [semantic-read, session-agent-network, model-egress]

  semantic-index-probe:
    image: curlimages/curl:8.12.1
    profiles: [semantic-index-check]
    environment:
      SEMANTIC_INDEXER_ADMIN_TOKEN: ${SEMANTIC_INDEXER_ADMIN_TOKEN:?required}
    command: ["/bin/sh", "-ec", "curl --fail --silent --show-error --retry 30 --retry-connrefused -H \"X-Api-Token: $$SEMANTIC_INDEXER_ADMIN_TOKEN\" -X POST http://semantic-indexer:8080/index/repositories/payment-service/ensure"]
    restart: "no"
    networks: [semantic-admin]

  semantic-query-probe:
    image: curlimages/curl:8.12.1
    profiles: [semantic-query-check]
    environment:
      SEMANTIC_QUERY_API_TOKEN: ${SEMANTIC_QUERY_API_TOKEN:?required}
    command: ["/bin/sh", "-ec", "curl --fail --silent --show-error --retry 30 --retry-connrefused -H \"X-Api-Token: $$SEMANTIC_QUERY_API_TOKEN\" http://semantic-query:8080/api/v1/repositories >/dev/null"]
    restart: "no"
    networks: [semantic-read]

  runtime-probe:
    image: curlimages/curl:8.12.1
    profiles: [runtime-check]
    command: ["/bin/sh", "-ec", "curl --fail --silent --show-error --retry 30 --retry-connrefused http://session-agent-runtime:8080/actuator/health >/dev/null"]
    restart: "no"
    networks: [semantic-read]

  model-egress-canary:
    image: hashicorp/http-echo:1.0.0
    profiles: [uat-evidence]
    command: ["-listen=:8080", "-text=model-egress-ok"]
    networks: [model-egress]

volumes:
  session-agent-postgres-data:
  semantic-mongodb-data:
  semantic-indexer-repository-data:
  semantic-indexer-jdt-data:

networks:
  session-agent-network:
    internal: true
  semantic-read:
    internal: true
  semantic-query-ingress:
  semantic-admin:
  model-egress:
