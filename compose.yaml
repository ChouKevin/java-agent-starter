x-runtime-logging: &runtime-logging
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

services:
  session-agent-postgres:
    <<: *runtime-logging
    image: postgres:17
    environment:
      POSTGRES_DB: session_agent
      POSTGRES_USER: session_agent
      POSTGRES_PASSWORD: ${SESSION_AGENT_POSTGRES_PASSWORD:?required}
    volumes:
      - session-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session_agent -d session_agent"]
    networks: [session-agent-network]

  semantic-service:
    <<: *runtime-logging
    build:
      context: ${STARTER_ROOT}/.runtime/sources/java-code-intelligence
    environment:
      SEMANTIC_API_TOKEN: ${SEMANTIC_API_TOKEN:?required}
      GIT_USERNAME: ${GIT_USERNAME:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      JDTLS_MAX_ACTIVE_WORKSPACES: ${JDTLS_MAX_ACTIVE_WORKSPACES:-2}
      REPOSITORY_SYNTAX_CACHE_MAXIMUM_WEIGHT: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_WEIGHT:-120000}
      REPOSITORY_SYNTAX_CACHE_MAXIMUM_ENTRY_WEIGHT: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_ENTRY_WEIGHT:-60000}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/semantic-repositories.yml
    ports:
      - "127.0.0.1:${SEMANTIC_HOST_PORT:-8080}:8080"
    volumes:
      - ${STARTER_ROOT}/config/semantic-repositories.yml:/config/semantic-repositories.yml:ro
      - payment-service-fixture:/fixtures/payment-service:ro
      - order-service-fixture:/fixtures/order-service:ro
      - semantic-repository-data:/data/repos
      - semantic-jdt-data:/data/jdtls
    networks: [session-agent-network]

  session-agent-runtime:
    <<: *runtime-logging
    build:
      context: ${STARTER_ROOT}/.runtime/sources/session-agent-runtime
    depends_on:
      session-agent-postgres:
        condition: service_healthy
      semantic-service:
        condition: service_started
    environment:
      SESSION_AGENT_DATASOURCE_URL: jdbc:postgresql://session-agent-postgres:5432/session_agent
      SESSION_AGENT_DATASOURCE_USERNAME: session_agent
      SESSION_AGENT_DATASOURCE_PASSWORD: ${SESSION_AGENT_POSTGRES_PASSWORD:?required}
      SEMANTIC_BASE_URL: http://semantic-service:8080
      SEMANTIC_API_TOKEN: ${SEMANTIC_API_TOKEN:?required}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?required}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GOOGLE_API_KEY:?required}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-3.1-flash-lite}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${SESSION_AGENT_HOST_PORT:-8090}:8080"
    networks: [session-agent-network]

  fixture-init:
    <<: *runtime-logging
    image: alpine:3.22
    profiles: [setup]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        find /fixtures/payment-service -mindepth 1 -delete &&
        find /fixtures/order-service -mindepth 1 -delete &&
        cp -a /fixture-source/payment-service/. /fixtures/payment-service/ &&
        cp -a /fixture-source/order-service/. /fixtures/order-service/ &&
        chown -R 10001:10001 /fixtures/payment-service /fixtures/order-service
    volumes:
      - ${STARTER_ROOT}/.runtime/sources/session-agent-runtime/fixtures/payment-service:/fixture-source/payment-service:ro
      - ${STARTER_ROOT}/.runtime/sources/session-agent-runtime/fixtures/order-service:/fixture-source/order-service:ro
      - payment-service-fixture:/fixtures/payment-service
      - order-service-fixture:/fixtures/order-service
    restart: "no"
    networks: [session-agent-network]

  network-probe:
    <<: *runtime-logging
    image: curlimages/curl:8.12.1
    profiles: [tools]
    depends_on:
      semantic-service:
        condition: service_started
      session-agent-runtime:
        condition: service_started
    environment:
      SEMANTIC_API_TOKEN: ${SEMANTIC_API_TOKEN:?required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        curl --fail --silent --show-error --retry 30 --retry-delay 2
        --retry-connrefused --connect-timeout 5 --max-time 10
        -H "X-Api-Token: $$SEMANTIC_API_TOKEN"
        http://semantic-service:8080/v1/repositories >/dev/null &&
        curl --fail --silent --show-error --retry 30 --retry-delay 2
        --retry-connrefused --connect-timeout 5 --max-time 10
        http://session-agent-runtime:8080/actuator/health >/dev/null
    restart: "no"
    networks: [session-agent-network]

volumes:
  session-agent-postgres-data:
  payment-service-fixture:
  order-service-fixture:
  semantic-repository-data:
  semantic-jdt-data:

networks:
  session-agent-network:
    driver: bridge
