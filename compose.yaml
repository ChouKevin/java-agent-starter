x-runtime-logging: &runtime-logging
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

x-contract-runner: &contract-runner
  image: maven:3.9.11-eclipse-temurin-21
  profiles: [contract]
  depends_on:
    semantic-service:
      condition: service_started
  environment:
    M6_SEMANTIC_BASE_URL: http://semantic-service:8080
    M6_SEMANTIC_API_TOKEN: ${SEMANTIC_API_TOKEN}
    M6_AGENT_REPO_ID: ${M6_AGENT_REPO_ID:-java-system-agent}
    M6_AGENT_EXPECTED_REVISION: ${M6_AGENT_EXPECTED_REVISION:-}
    M6_DISCOVERY_REPO_ID: ${M6_DISCOVERY_REPO_ID:-m6-semantic-contract}
    M6_DISCOVERY_EXPECTED_REVISION: ${M6_DISCOVERY_EXPECTED_REVISION:-FIXTURE}
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}
  restart: "no"
  networks: [agent-network]

services:
  postgres:
    <<: *runtime-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-java_system_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc-postgres-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [agent-network]

  semantic-service:
    <<: *runtime-logging
    image: java-code-intelligence:uat
    build:
      context: ${STARTER_ROOT}/.runtime/sources/java-code-intelligence
    ports:
      - "${SEMANTIC_HOST_PORT:-8080}:8080"
    environment:
      SEMANTIC_API_TOKEN: ${SEMANTIC_API_TOKEN}
      GIT_USERNAME: ${GIT_USERNAME:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      JDTLS_MAX_ACTIVE_WORKSPACES: ${JDTLS_MAX_ACTIVE_WORKSPACES:-2}
      REPOSITORY_SYNTAX_CACHE_MAXIMUM_WEIGHT: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_WEIGHT:-120000}
      REPOSITORY_SYNTAX_CACHE_MAXIMUM_ENTRY_WEIGHT: ${REPOSITORY_SYNTAX_CACHE_MAXIMUM_ENTRY_WEIGHT:-60000}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/semantic-repositories.yml
    volumes:
      - ${STARTER_ROOT}/config/semantic-repositories.yml:/config/semantic-repositories.yml:ro
      - semantic-fixture:/fixtures/m6-semantic-contract
      - knowledge-fixture:/fixtures/m7-knowledge-query
      - ${STARTER_ROOT}/data/repositories:/data/repos
      - ${STARTER_ROOT}/data/jdtls-workspaces:/data/jdtls
    restart: unless-stopped
    networks: [agent-network]

  java-system-agent:
    <<: *runtime-logging
    image: java-system-agent:uat
    build:
      context: ${STARTER_ROOT}/.runtime/sources/java-system-agent
    depends_on:
      postgres:
        condition: service_healthy
      semantic-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-agent-runtime}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-java_system_agent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poc-postgres-password}
      CODEBASE_SERVICE_BASE_URL: http://semantic-service:8080
      CODEBASE_SERVICE_API_TOKEN: ${SEMANTIC_API_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-poc-not-used}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-3.1-flash-lite}
    restart: unless-stopped
    stop_grace_period: 45s
    networks: [agent-network]

  permissions-init:
    <<: *runtime-logging
    image: java-code-intelligence:uat
    profiles: [setup]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        find /fixtures/m6-semantic-contract -mindepth 1 -delete &&
        cp -a /fixture-source/m6-semantic-contract/. /fixtures/m6-semantic-contract/ &&
        chown -R 10001:10001 /data/repos /data/jdtls &&
        chown -R 10001:10001 /fixtures/m6-semantic-contract &&
        find /data/repos /data/jdtls -type d -exec chmod 0750 {} +
    volumes:
      - ${STARTER_ROOT}/data/repositories:/data/repos
      - ${STARTER_ROOT}/data/jdtls-workspaces:/data/jdtls
      - ${STARTER_ROOT}/.runtime/sources/java-system-agent/src/test/resources/fixtures/m6-semantic-contract:/fixture-source/m6-semantic-contract:ro
      - semantic-fixture:/fixtures/m6-semantic-contract
    restart: "no"
    networks: [agent-network]

  knowledge-fixture-init:
    <<: *runtime-logging
    image: java-code-intelligence:uat
    profiles: [knowledge]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mkdir -p /data/jdtls/m7-knowledge-query &&
        find /fixtures/m7-knowledge-query -mindepth 1 -delete &&
        find /data/jdtls/m7-knowledge-query -mindepth 1 -delete &&
        cp -a /fixture-source/m7-knowledge-query/. /fixtures/m7-knowledge-query/ &&
        chown -R 10001:10001 /fixtures/m7-knowledge-query /data/jdtls/m7-knowledge-query
    volumes:
      - ${STARTER_ROOT}/.runtime/sources/java-system-agent/src/test/resources/fixtures/m7-knowledge-query:/fixture-source/m7-knowledge-query:ro
      - knowledge-fixture:/fixtures/m7-knowledge-query
      - ${STARTER_ROOT}/data/jdtls-workspaces:/data/jdtls
    restart: "no"
    networks: [agent-network]

  knowledge-db-init:
    <<: *runtime-logging
    image: postgres:17-alpine
    profiles: [knowledge]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-java_system_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc-postgres-password}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export PGPASSWORD="$$POSTGRES_PASSWORD"; export PGHOST=postgres; export PGDATABASE=postgres;
        dropdb -U "$$POSTGRES_USER" --if-exists --force agent_m7_knowledge;
        createdb -U "$$POSTGRES_USER" agent_m7_knowledge
    restart: "no"
    networks: [agent-network]

  network-probe:
    <<: *runtime-logging
    image: curlimages/curl:8.12.1
    profiles: [tools]
    depends_on:
      semantic-service:
        condition: service_started
    environment:
      SEMANTIC_API_TOKEN: ${SEMANTIC_API_TOKEN}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-max-time 120
        --retry-connrefused --connect-timeout 5 --max-time 10
        -H "X-Api-Token: $$SEMANTIC_API_TOKEN" http://semantic-service:8080/v1/repositories
    restart: "no"
    networks: [agent-network]

  semantic-contract:
    <<: *contract-runner
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mvn --batch-mode --no-transfer-progress clean test -Dtest=McpLiveContractIT;
        status=$$?;
        mkdir -p /reports/semantic &&
        cp /workspace/target/surefire-reports/TEST-com.java.semantic.mcp.McpLiveContractIT.xml /reports/semantic/ &&
        chown -R "$$HOST_UID:$$HOST_GID" /reports;
        report_status=$$?;
        if [ "$$status" -ne 0 ]; then exit "$$status"; fi;
        exit "$$report_status"
    volumes:
      - semantic-contract-workspace:/workspace
      - ${STARTER_ROOT}/.runtime/sources/java-code-intelligence/pom.xml:/workspace/pom.xml:ro
      - ${STARTER_ROOT}/.runtime/sources/java-code-intelligence/src:/workspace/src:ro
      - maven-cache:/root/.m2
      - ${STARTER_ROOT}/reports/contract-uat/${M6_RUN_ID}:/reports

  agent-contract:
    <<: *contract-runner
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mvn --batch-mode --no-transfer-progress clean test -Dtest=JavaSemanticServiceLiveContractIT;
        status=$$?;
        mkdir -p /reports/agent &&
        cp /workspace/target/surefire-reports/TEST-com.java.system.agent.codeintelligence.semantic.JavaSemanticServiceLiveContractIT.xml /reports/agent/ &&
        chown -R "$$HOST_UID:$$HOST_GID" /reports;
        report_status=$$?;
        if [ "$$status" -ne 0 ]; then exit "$$status"; fi;
        exit "$$report_status"
    volumes:
      - agent-contract-workspace:/workspace
      - ${STARTER_ROOT}/.runtime/sources/java-system-agent/pom.xml:/workspace/pom.xml:ro
      - ${STARTER_ROOT}/.runtime/sources/java-system-agent/src:/workspace/src:ro
      - maven-cache:/root/.m2
      - ${STARTER_ROOT}/reports/contract-uat/${M6_RUN_ID}:/reports

  agent-knowledge:
    <<: *runtime-logging
    image: maven:3.9.11-eclipse-temurin-21
    profiles: [knowledge]
    depends_on:
      postgres:
        condition: service_healthy
      semantic-service:
        condition: service_started
      knowledge-fixture-init:
        condition: service_completed_successfully
      knowledge-db-init:
        condition: service_completed_successfully
    environment:
      M7_KNOWLEDGE_LIVE: "true"
      M7_KNOWLEDGE_SEED: ${M7_KNOWLEDGE_SEED}
      M7_AGENT_SOURCE_SHA: ${M7_AGENT_SOURCE_SHA}
      M7_SEMANTIC_SOURCE_SHA: ${M7_SEMANTIC_SOURCE_SHA}
      M7_REPORT_DIRECTORY: /reports
      CODEBASE_SERVICE_BASE_URL: http://semantic-service:8080
      CODEBASE_SERVICE_API_TOKEN: ${SEMANTIC_API_TOKEN}
      SPRING_PROFILES_ACTIVE: agent-runtime
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent_m7_knowledge
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-poc-postgres-password}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-3.1-flash-lite}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mvn --batch-mode --no-transfer-progress clean test -Dtest=M7KnowledgeQueryLiveIT;
        maven_status=$$?;
        mkdir -p /reports;
        cp /workspace/target/surefire-reports/TEST-com.java.system.agent.M7KnowledgeQueryLiveIT.xml /reports/;
        copy_status=$$?;
        chown -R "$$HOST_UID:$$HOST_GID" /reports;
        ownership_status=$$?;
        if [ "$$maven_status" -ne 0 ]; then exit "$$maven_status"; fi;
        if [ "$$copy_status" -ne 0 ]; then exit "$$copy_status"; fi;
        exit "$$ownership_status"
    volumes:
      - agent-knowledge-workspace:/workspace
      - ${STARTER_ROOT}/.runtime/sources/java-system-agent/pom.xml:/workspace/pom.xml:ro
      - ${STARTER_ROOT}/.runtime/sources/java-system-agent/src:/workspace/src:ro
      - maven-cache:/root/.m2
      - ${STARTER_ROOT}/reports/knowledge-uat/${M7_RUN_ID}:/reports
    restart: "no"
    networks: [agent-network]

volumes:
  postgres-data:
  semantic-contract-workspace:
  agent-contract-workspace:
  semantic-fixture:
  knowledge-fixture:
  agent-knowledge-workspace:
  maven-cache:

networks:
  agent-network:
    driver: bridge
